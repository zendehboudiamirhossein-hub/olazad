# Local development postgres for AzadGram Panel.
# Use: docker compose up -d
# Then set DATABASE_URL=postgresql://azadgram:azadgram@localhost:5432/azadgram

services:
  postgres:
    image: postgres:16-alpine
    container_name: azadgram-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: azadgram
      POSTGRES_PASSWORD: azadgram
      POSTGRES_DB: azadgram
    ports:
      - "5432:5432"
    volumes:
      - azadgram-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azadgram"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  azadgram-pgdata:
